<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>PrayerTime Barakat</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#06080b;
      --card:#0b0f12;
      --glass: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.10);
      --muted: rgba(255,255,255,.55);
      --muted2: rgba(255,255,255,.35);
      --neon:#67E5FF;
      --danger:#ff5c7a;
      --ok:#7CFFB2;
      --radius:18px;
      --pad:14px;
      --shadow: 0 12px 40px rgba(0,0,0,.45);
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: var(--font);
      background: radial-gradient(900px 600px at 30% 10%, rgba(103,229,255,.10), transparent 55%),
                  radial-gradient(800px 500px at 80% 40%, rgba(103,229,255,.08), transparent 60%),
                  linear-gradient(180deg, #05070a, #070a0d 40%, #05070a);
      color:#fff;
    }

    .wrap{
      min-height:100%;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      max-width: 680px;
      margin: 0 auto;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 6px 2px 14px;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:2px;
      line-height:1.1;
    }

    .brand .title{
      font-size: 18px;
      font-weight: 900;
      letter-spacing:.2px;
    }

    .brand .sub{
      font-size: 12px;
      color: var(--muted2);
      font-weight: 700;
    }

    .btn{
      appearance:none;
      border: 1px solid rgba(103,229,255,.35);
      background: rgba(103,229,255,.12);
      color:#fff;
      font-weight: 900;
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      box-shadow: 0 10px 30px rgba(103,229,255,.08);
      transition: transform .08s ease, filter .2s ease, opacity .2s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: scale(.98); }
    .btn.secondary{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card{
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-2px;
      background: radial-gradient(500px 140px at 30% 10%, rgba(103,229,255,.18), transparent 60%);
      pointer-events:none;
    }

    .card-inner{
      position:relative;
      padding: 14px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .field{
      flex: 1 1 180px;
      min-width: 160px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    label{
      font-size: 11px;
      color: var(--muted2);
      font-weight: 800;
      letter-spacing:.2px;
    }
    select, input{
      width:100%;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.20);
      color:#fff;
      padding: 12px 12px;
      outline:none;
      font-weight: 800;
    }
    input::placeholder{ color: rgba(255,255,255,.35); font-weight:700; }

    .hint{
      font-size: 12px;
      color: var(--muted2);
      font-weight: 700;
      margin-top: 8px;
      line-height: 1.35;
    }

    .timer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .pill{
      border-radius: 999px;
      border: 1px solid rgba(103,229,255,.35);
      background: rgba(103,229,255,.10);
      padding: 10px 12px;
      font-weight: 900;
      display:inline-flex;
      align-items:center;
      gap: 10px;
    }

    .pill .icon{
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      background: radial-gradient(circle at 30% 30%, rgba(103,229,255,.25), transparent 65%);
      border: 1px solid rgba(103,229,255,.25);
    }

    .pill .big{
      font-size: 22px;
      letter-spacing:.5px;
    }

    .pill .small{
      font-size: 12px;
      color: rgba(255,255,255,.75);
      font-weight: 900;
    }

    .muted{
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap: 10px;
      padding: 6px 2px 2px;
    }

    .item{
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.16);
      padding: 12px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .item.next{
      border-color: rgba(103,229,255,.55);
      box-shadow: 0 10px 30px rgba(103,229,255,.10);
      background: linear-gradient(180deg, rgba(103,229,255,.10), rgba(0,0,0,.14));
    }

    .pname{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 120px;
    }
    .pname .en{
      font-size: 16px;
      font-weight: 900;
      color: rgba(255,255,255,.92);
    }
    .pname .ar{
      font-size: 13px;
      font-weight: 800;
      color: rgba(255,255,255,.40);
    }

    .ptime{
      font-size: 18px;
      font-weight: 1000;
      letter-spacing:.3px;
      color: rgba(255,255,255,.88);
    }

    .status{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,.40);
      font-weight: 800;
    }

    .err{
      color: rgba(255,92,122,.95);
      font-weight: 900;
    }
    .ok{
      color: rgba(124,255,178,.9);
      font-weight: 900;
    }

    .foot{
      padding: 10px 4px 0;
      text-align:center;
      color: rgba(255,255,255,.22);
      font-weight: 900;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="title">PrayerTime Barakat</div>
        <div class="sub" id="subtitle">Выберите город — получайте время намаза</div>
      </div>
      <button class="btn" id="btnRefresh">Обновить</button>
    </div>

    <div class="grid">
      <!-- SETTINGS -->
      <div class="card">
        <div class="card-inner">
          <div class="row">
            <div class="field">
              <label for="country">Страна</label>
              <select id="country">
                <option value="Germany">Germany</option>
                <option value="United Arab Emirates">United Arab Emirates</option>
                <option value="Kazakhstan">Kazakhstan</option>
                <option value="Russia">Russia</option>
                <option value="Turkey">Turkey</option>
                <option value="Indonesia">Indonesia</option>
                <option value="France">France</option>
                <option value="Tajikistan">Tajikistan</option>
                <option value="Uzbekistan">Uzbekistan</option>
                <option value="Saudi Arabia">Saudi Arabia</option>
                <option value="Egypt">Egypt</option>
              </select>
            </div>

            <div class="field">
              <label for="city">Город</label>
              <input id="city" type="text" placeholder="Например: Berlin" autocomplete="off" />
            </div>

            <div class="field">
              <label for="method">Метод расчёта</label>
              <select id="method">
                <option value="4">Umm al-Qura (4)</option>
                <option value="2">ISNA (2)</option>
                <option value="3">MWL (3)</option>
                <option value="5">Egypt (5)</option>
                <option value="15">Moonsighting (15)</option>
              </select>
            </div>
          </div>

          <div class="hint">
            Данные берутся из AlAdhan по городу. Если город не находится — попробуй написание на английском (например “Munich”, “Cologne”).
          </div>

          <div class="status" id="status">Готово.</div>
        </div>
      </div>

      <!-- TIMER -->
      <div class="card">
        <div class="card-inner timer">
          <div class="pill">
            <div class="icon">⏱</div>
            <div>
              <div class="small" id="untilLabel">До следующей молитвы</div>
              <div class="big" id="countdown">--:--:--</div>
            </div>
          </div>
          <div class="muted" id="nextInfo">Следующая: —</div>
        </div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div class="card-inner">
          <div class="muted" style="margin-bottom:10px;">Время молитв (сегодня)</div>
          <div class="list" id="list"></div>
          <div class="foot" id="foot">—</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -----------------------
    // Telegram WebApp init
    // -----------------------
    (function initTelegram(){
      try{
        const tg = window.Telegram?.WebApp;
        if (!tg) return;
        tg.ready();
        tg.expand();
        // Ставим цвет под тёмную тему (не обязательно)
        tg.setHeaderColor?.("#05070a");
        tg.setBackgroundColor?.("#05070a");
      }catch(_){}
    })();

    // -----------------------
    // Helpers
    // -----------------------
    const $ = (id) => document.getElementById(id);

    function pad2(n){ return String(n).padStart(2,"0"); }
    function parseHHMM(s){
      // ожидаем "HH:MM" (иногда API отдаёт "HH:MM (CET)")
      if (!s) return null;
      const m = String(s).match(/(\d{1,2}):(\d{2})/);
      if (!m) return null;
      return { h: Number(m[1]), m: Number(m[2]) };
    }
    function toDateToday(h, m){
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d;
    }
    function formatHHMM(d){
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }
    function haptic(type="light"){
      try{
        const tg = window.Telegram?.WebApp;
        tg?.HapticFeedback?.impactOccurred?.(type);
      }catch(_){}
    }

    function savePrefs(p){
      localStorage.setItem("ptb_prefs_v1", JSON.stringify(p));
    }
    function loadPrefs(){
      try{
        return JSON.parse(localStorage.getItem("ptb_prefs_v1") || "null");
      }catch(_){ return null; }
    }

    function saveCache(cache){
      localStorage.setItem("ptb_cache_v1", JSON.stringify(cache));
    }
    function loadCache(){
      try{
        return JSON.parse(localStorage.getItem("ptb_cache_v1") || "null");
      }catch(_){ return null; }
    }

    function setStatus(text, kind){
      const el = $("status");
      el.textContent = text;
      el.className = "status" + (kind ? (" " + kind) : "");
    }

    // -----------------------
    // Prayer model
    // -----------------------
    const PRAYERS = [
      { key:"Fajr",    en:"Fajr",    ar:"الفجر"   },
      { key:"Dhuhr",   en:"Dhuhr",   ar:"الظهر"   },
      { key:"Asr",     en:"Asr",     ar:"العصر"   },
      { key:"Maghrib", en:"Maghrib", ar:"المغرب"  },
      { key:"Isha",    en:"Isha",    ar:"العشاء"  }
    ];

    function buildList(prayerTimes){
      const list = $("list");
      list.innerHTML = "";

      // find next
      const now = new Date();
      let next = null;

      const items = PRAYERS.map(p => {
        const v = prayerTimes?.[p.key];
        const hm = parseHHMM(v);
        const dt = hm ? toDateToday(hm.h, hm.m) : null;
        return { ...p, raw:v, dt };
      }).filter(x => x.dt);

      items.sort((a,b) => a.dt - b.dt);

      next = items.find(x => x.dt > now) || items[0] || null;

      for (const it of items){
        const div = document.createElement("div");
        div.className = "item" + (next && it.key === next.key ? " next" : "");
        div.innerHTML = `
          <div class="pname">
            <div class="en">${it.en}</div>
            <div class="ar">${it.ar}</div>
          </div>
          <div class="ptime">${formatHHMM(it.dt)}</div>
        `;
        list.appendChild(div);
      }

      return next;
    }

    function computeRemaining(nextDt){
      const now = new Date();
      let diff = nextDt - now;

      // если уже прошло — считаем до завтрашнего такого же времени
      if (diff <= 0){
        const t = new Date(nextDt.getTime());
        t.setDate(t.getDate() + 1);
        diff = t - now;
      }

      const s = Math.floor(diff / 1000);
      const hh = Math.floor(s / 3600);
      const mm = Math.floor((s % 3600) / 60);
      const ss = s % 60;

      return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
    }

    let tickTimer = null;
    function startCountdown(next){
      if (tickTimer) clearInterval(tickTimer);

      const cd = $("countdown");
      const info = $("nextInfo");

      if (!next || !next.dt){
        cd.textContent = "--:--:--";
        info.textContent = "Следующая: —";
        return;
      }

      function render(){
        cd.textContent = computeRemaining(next.dt);
        info.textContent = `Следующая: ${next.en} в ${formatHHMM(next.dt)}`;
      }

      render();
      tickTimer = setInterval(render, 1000);
    }

    // -----------------------
    // API: AlAdhan timingsByCity
    // -----------------------
    async function fetchWithTimeout(url, ms=12000){
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try{
        const r = await fetch(url, { signal: ctrl.signal });
        return r;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadTimings(city, country, methodId){
      const u = new URL("https://api.aladhan.com/v1/timingsByCity");
      u.searchParams.set("city", city);
      u.searchParams.set("country", country);
      u.searchParams.set("method", String(methodId));
      // можно добавить school=1/0 и т.п. при желании

      const resp = await fetchWithTimeout(u.toString(), 12000);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const json = await resp.json();
      if (!json || json.code !== 200) throw new Error("Bad response");
      const t = json?.data?.timings;
      if (!t) throw new Error("No timings");

      // Берём только нужные
      const out = {};
      for (const p of PRAYERS){
        out[p.key] = t[p.key];
      }

      const meta = {
        dateReadable: json?.data?.date?.readable || "",
        timezone: json?.data?.meta?.timezone || ""
      };

      return { timings: out, meta };
    }

    // -----------------------
    // App state
    // -----------------------
    const ui = {
      country: $("country"),
      city: $("city"),
      method: $("method"),
      refresh: $("btnRefresh"),
      subtitle: $("subtitle"),
      foot: $("foot")
    };

    function readUI(){
      return {
        country: ui.country.value.trim(),
        city: ui.city.value.trim(),
        method: Number(ui.method.value)
      };
    }

    function applyPrefsToUI(p){
      if (!p) return;
      if (p.country) ui.country.value = p.country;
      if (p.city) ui.city.value = p.city;
      if (p.method) ui.method.value = String(p.method);
    }

    function setFooter(meta, prefs){
      const parts = [];
      if (prefs?.city) parts.push(`${prefs.city}, ${prefs.country}`);
      if (meta?.dateReadable) parts.push(meta.dateReadable);
      if (meta?.timezone) parts.push(meta.timezone);
      ui.foot.textContent = parts.length ? parts.join(" • ") : "—";
    }

    async function refresh(){
      const prefs = readUI();
      if (!prefs.city){
        setStatus("Введите город.", "err");
        haptic("light");
        return;
      }

      savePrefs(prefs);
      ui.refresh.disabled = true;
      setStatus("Загружаю время намаза…", "");

      try{
        const { timings, meta } = await loadTimings(prefs.city, prefs.country, prefs.method);

        // cache
        saveCache({
          savedAt: Date.now(),
          prefs,
          timings,
          meta
        });

        ui.subtitle.textContent = `${prefs.city}, ${prefs.country}`;
        const next = buildList(timings);
        startCountdown(next);
        setFooter(meta, prefs);

        setStatus("Обновлено ✅", "ok");
        haptic("light");
      }catch(err){
        // fallback to cache
        const cache = loadCache();
        if (cache?.timings && cache?.prefs){
          ui.subtitle.textContent = `${cache.prefs.city}, ${cache.prefs.country}`;
          const next = buildList(cache.timings);
          startCountdown(next);
          setFooter(cache.meta, cache.prefs);

          setStatus("Не удалось обновить. Показаны последние сохранённые данные.", "err");
        }else{
          $("list").innerHTML = "";
          startCountdown(null);
          setFooter(null, null);
          setStatus("Ошибка загрузки. Проверь город/интернет.", "err");
        }
        haptic("light");
      }finally{
        ui.refresh.disabled = false;
      }
    }

    // Auto refresh when user changes fields (small debounce)
    let debounce = null;
    function scheduleRefresh(){
      if (debounce) clearTimeout(debounce);
      debounce = setTimeout(() => refresh(), 450);
    }

    // -----------------------
    // Boot
    // -----------------------
    (function boot(){
      // Defaults
      const defaults = { country:"Germany", city:"Berlin", method:4 };

      // Restore prefs
      const p = loadPrefs() || defaults;
      applyPrefsToUI(p);

      // Try show cached immediately (fast UI)
      const cache = loadCache();
      if (cache?.timings && cache?.prefs){
        applyPrefsToUI(cache.prefs);
        ui.subtitle.textContent = `${cache.prefs.city}, ${cache.prefs.country}`;
        const next = buildList(cache.timings);
        startCountdown(next);
        setFooter(cache.meta, cache.prefs);
        setStatus("Загружены сохранённые данные. Обновляю…", "");
      } else {
        ui.subtitle.textContent = "Выберите город — получайте время намаза";
      }

      // Listeners
      ui.refresh.addEventListener("click", refresh);
      ui.country.addEventListener("change", scheduleRefresh);
      ui.method.addEventListener("change", scheduleRefresh);
      ui.city.addEventListener("input", scheduleRefresh);

      // First refresh
      refresh();
    })();
  </script>
</body>
</html>
